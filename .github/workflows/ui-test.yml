name: UI Tests
on:
  push:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: db_user
          POSTGRES_PASSWORD: db_pwd123
        ports:
          - 5477:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://db_user:db_pwd123@localhost:5477/leapsome?schema=public
      ACCESS_TOKEN_SECRET: 123
      SERVICE_PORT: 3022
      VITE_API_BASE_URL: http://localhost:3022
      API_BASE_URL: http://localhost:3022
      CLIENT_BASE_URL: http://localhost:5173
      JUNIT_OUTPUT_FILE: results-e2e.xml
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    - name: Generate Prisma client
      run: npx prisma generate
    - name: Run database migrations
      run: npx prisma migrate deploy
    - name: Start API and client servers
      run: nohup npm run dev > /tmp/dev-servers.log 2>&1 &
    - name: Wait for servers to be ready
      run: npx wait-on tcp:localhost:3022 tcp:localhost:5173 -t 30000
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run E2E tests
      run: npm run e2e-test
    - name: Upload dev server logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: dev-server-logs
        path: /tmp/dev-servers.log
        retention-days: 30
    - name: Publish E2E JUnit test results
      uses: dorny/test-reporter@v2
      if: always()
      with:
        name: "Playwright E2E Tests"
        path: "results-e2e.xml"
        reporter: jest-junit
        fail-on-error: "true"
